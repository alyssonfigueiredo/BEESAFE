name: Conferir Instagram

# Confere no próprio Instagram (não no log do robô) se o que está aprovado e vencido realmente
# foi ao ar, e manda e-mail se não foi. Detalhes em scripts/conferir-instagram.mjs.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      email_teste:
        description: "Só mandar um e-mail de teste (não confere nada)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: conferir-instagram
  cancel-in-progress: false

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instala o envio de e-mail
        run: npm install --prefix .mail --no-package-lock --no-audit --no-fund nodemailer@6.9.16

      - name: Manda e-mail de teste
        if: inputs.email_teste
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERTA_EMAIL_PARA: ${{ secrets.ALERTA_EMAIL_PARA }}
        run: node scripts/conferir-instagram.mjs --email-teste

      - name: Confere no Instagram
        if: ${{ !inputs.email_teste }}
        env:
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERTA_EMAIL_PARA: ${{ secrets.ALERTA_EMAIL_PARA }}
        run: node scripts/conferir-instagram.mjs

      - name: Grava o controle da conferência
        if: ${{ always() && !inputs.email_teste }}
        run: |
          if ! git diff --quiet docs/legendas/conferencia.json 2>/dev/null || [ -n "$(git ls-files --others --exclude-standard docs/legendas/conferencia.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/legendas/conferencia.json
            git commit -m "Conferência do Instagram: atualiza controle"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            git push || true
          fi

      # Se o próprio e-mail falhar (secrets ausentes, senha de app errada), o aviso cai numa
      # issue do GitHub, que também chega por e-mail ao dono do repositório.
      - name: Avisa por issue se a conferência ou o e-mail falharem
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = "CONFERENCIA DO INSTAGRAM FALHOU: pode haver post que nao foi ao ar";
            const corpo = [
              "A conferência no Instagram não conseguiu terminar ou não conseguiu mandar o e-mail.",
              "Isso significa que **você pode não estar sendo avisado** de um post que não saiu.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Causas comuns: secrets GMAIL_USER / GMAIL_APP_PASSWORD ausentes no GitHub, senha de app revogada, ou token da Meta vencido.",
            ].join("\n");
            const abertas = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "instagram",
            });
            const jaTem = abertas.data.find((i) => i.title === titulo);
            if (jaTem) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: jaTem.number, body: corpo,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titulo, body: corpo, labels: ["instagram"], assignees: [context.repo.owner],
              });
            }
