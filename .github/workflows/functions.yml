name: Deploy Edge Functions

on:
  push:
    paths: ["supabase/functions/**"]

jobs:
  deploy:
    if: github.ref == 'refs/heads/claude/laughing-keller-my8t7c' || github.ref == 'refs/heads/claude/ecstatic-darwin-cmf7sw'
    runs-on: ubuntu-24.04
    concurrency: { group: functions-producao, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - name: Publica as Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Secret SUPABASE_ACCESS_TOKEN não existe: nenhuma função foi publicada. Veja supabase/README.md."
            exit 0
          fi
          npx supabase functions deploy --project-ref ntjirpqulrnieeglpiei
