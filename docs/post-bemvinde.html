<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Irisa · Carrossel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600&family=Oswald:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>

:root{
  --paper:#F5F4F1;--surface:#FFFFFF;--subtle:#ECEAE5;--border:#E6E3DD;--night:#141829;--night2:#0F1220;--ink:#141829;--muted:#3D4560;--dim:#7C8296;
  --coral:#FF6964;--orange:#FFA353;--yellow:#FFD066;--turq:#49DCC0;--lilac:#A889FF;--blue:#59A7FF;--amber:#FFAD0F;
  --coralInk:#C72825;--orangeInk:#AB6207;--yellowInk:#9C6C00;--turqInk:#0A8B7A;--lilacInk:#6037F0;
  --wordmark:"Urbanist","Helvetica Neue",Arial,sans-serif;--display:"Oswald","Arial Narrow",Impact,sans-serif;--body:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --rainbow:linear-gradient(90deg,var(--coral),var(--orange),var(--yellow),var(--turq),var(--blue),var(--lilac));
  --pane:rgba(255,255,255,.62);--pane-edge:rgba(255,255,255,.8);
  --shadow-card:0 2px 4px rgba(20,24,41,.03),0 16px 40px rgba(20,24,41,.07);
  --glass-inset:inset 0 1px 0 #fff,inset 0 0 0 1px var(--pane-edge);
  --r-xl:28px;--r-lg:24px;--r-md:18px;
  --gut:clamp(16px,6vw,96px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;overflow-x:hidden}
a{color:inherit}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--gut)}
section{position:relative}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.22em;font-size:13px;color:var(--turqInk)}
.dark .eyebrow{color:var(--turq)}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;margin:0;text-wrap:balance}
h2{font-weight:500;letter-spacing:.06em;font-size:clamp(32px,4.6vw,60px);line-height:1}
h3{font-weight:500;letter-spacing:.1em;font-size:18px}
.lead{font-size:clamp(18px,1.8vw,21px);color:var(--muted);max-width:56ch}
.dark{background:var(--night);color:var(--ink)}
.dark .lead,.dark p{color:var(--muted)}
.rule{height:6px;width:140px;border-radius:3px;background:var(--rainbow)}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:15px;padding:15px 24px;border-radius:14px;text-decoration:none;border:0;cursor:pointer;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--coral);color:var(--night);box-shadow:0 10px 30px -10px rgba(244,115,111,.7)}
.btn.turq{background:var(--turq);color:var(--night);box-shadow:0 10px 30px -10px rgba(92,201,180,.7)}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btns{display:flex;flex-wrap:wrap;gap:12px}

/* nav */
nav.top{position:fixed;inset:0 0 auto;z-index:50;transition:background .3s,box-shadow .3s,color .3s;color:var(--ink)}
nav.top .wrap{display:flex;align-items:center;gap:20px;height:68px}
nav.top.solid{background:rgba(250,249,246,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--border);color:var(--ink)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--wordmark);font-weight:500;text-transform:uppercase;letter-spacing:.18em;font-size:20px}
.logo b{font-weight:500;color:var(--yellow)}
nav.top.solid .logo b{color:var(--amber)}
.mark{width:26px;height:26px;flex:none;display:block}
span.mark{border-radius:50%;background:conic-gradient(from -90deg,var(--coral),var(--orange),var(--yellow),var(--turq),var(--blue),var(--lilac),var(--coral));position:relative}
span.mark::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--night2)}
nav.top.solid .mark::after{background:#fff}
span.mark::before{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#fff;z-index:1}
nav.top.solid .mark::before{background:var(--night2)}
.links{margin-left:auto;display:flex;align-items:center;gap:26px;font-size:15px}
.links a{text-decoration:none;opacity:.85}
.links a:hover{opacity:1}
.links .btn{padding:10px 16px;font-size:13px;opacity:1}
@media(max-width:860px){.links a:not(.btn){display:none}}

/* hero */
.hero{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:110px 0 80px;overflow:hidden;isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;filter:blur(40px);
  background:radial-gradient(34% 34% at 20% 30%,rgba(92,201,180,.30),transparent 70%),radial-gradient(30% 30% at 80% 72%,rgba(174,150,242,.30),transparent 70%)}
.hero::after{background:radial-gradient(26% 26% at 72% 18%,rgba(244,115,111,.26),transparent 70%),radial-gradient(24% 24% at 28% 82%,rgba(240,202,117,.20),transparent 70%)}
.js .hero::before{animation:drift 20s ease-in-out infinite alternate}
.js .hero::after{animation:drift 24s ease-in-out -8s infinite alternate-reverse}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(5%,-4%) rotate(8deg)}}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;width:100%}
.wordmark{font-family:var(--wordmark);font-weight:500;text-transform:uppercase;letter-spacing:.16em;font-size:clamp(20px,2vw,24px)}
.wordmark b{font-weight:500;color:var(--yellow)}
.hero h1{font-weight:300;letter-spacing:.05em;font-size:clamp(50px,8.4vw,120px);line-height:.92;margin:22px 0 26px}
.hero h1 em{font-style:normal;font-weight:500;background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{color:#E3E6EF;margin-top:26px}
.hero .meta{margin-top:26px;font-size:14px;color:#AEB3C6;display:flex;flex-wrap:wrap;gap:8px 18px}
.hero .meta span{display:inline-flex;align-items:center;gap:8px}
.hero .meta span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--turq)}
.hero .btns{margin-top:32px}
.stage{position:relative;height:600px;display:flex;justify-content:center;align-items:center}
.stage .radar{position:absolute;width:560px;max-width:120%;opacity:.9;left:50%;top:50%;transform:translate(-50%,-50%)}
.stage .cell{position:absolute}
.stage .cell:nth-of-type(1){transform:translate(-86px,10px) rotate(-7deg)}
.stage .cell:nth-of-type(2){transform:translate(96px,-6px) rotate(5deg)}
.stage .caption{display:none}
@media(max-width:960px){.hero .wrap{grid-template-columns:1fr}.stage{height:560px}}
@media(max-width:560px){.stage{height:540px}.stage .cell:nth-of-type(1){display:none}.stage .cell:nth-of-type(2){transform:rotate(3deg)}.stage .radar{width:440px}}

/* faixa que corre */
.marquee{background:var(--night2);color:var(--ink);overflow:hidden;padding:20px 0;border-block:1px solid rgba(255,255,255,.08)}
.marquee .track{display:flex;gap:48px;width:max-content;font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:clamp(20px,2.4vw,28px);font-weight:400;white-space:nowrap}
.js .marquee .track{animation:marq 40s linear infinite}
.marquee i{font-style:normal;color:var(--yellow)}
.marquee .dot{width:12px;height:12px;border-radius:50%;background:var(--rainbow);align-self:center;flex:none}
@keyframes marq{to{transform:translateX(-50%)}}

/* blocos */
.block{padding:clamp(80px,11vw,140px) 0;overflow-x:clip}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,80px);align-items:center}
.split.rev>:first-child{order:2}
@media(max-width:900px){.split{grid-template-columns:1fr}.split.rev>:first-child{order:0}}
.split .txt{display:flex;flex-direction:column;gap:22px}
.showcase{display:flex;justify-content:center;position:relative}
.showcase .halo{position:absolute;width:min(420px,90vw);height:min(420px,90vw);border-radius:50%;filter:blur(60px);opacity:.45;left:50%;top:50%;transform:translate(-50%,-50%);z-index:0}
.showcase .cell{position:relative;z-index:1}
.showcase .caption{display:none}
.axes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.axis-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.axis-card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -24px rgba(30,35,64,.35)}
.axis-card b{font-family:var(--display);font-weight:500;font-size:40px;line-height:1;letter-spacing:.02em}
.axis-card h3{font-size:15px}
.axis-card p{font-size:14px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badges span{padding:6px 12px;border-radius:8px;font-weight:500;font-size:14px}
.tipos{display:flex;flex-wrap:wrap;gap:8px}
.tipos span{padding:8px 14px;border-radius:999px;font-weight:500;font-size:14px;color:var(--night)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.checks li{display:flex;gap:12px;align-items:flex-start}
.checks li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c,var(--turq));flex:none;margin-top:8px}

/* regra */
.regra h2{font-size:clamp(36px,5vw,68px);line-height:.98}
.regra h2 .a{color:var(--turqInk)}.regra h2 .b{color:var(--coralInk)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
@media(max-width:900px){.trio{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:10px}
.card p{color:var(--muted);font-size:15.5px}
.dark .card{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12)}
.dark .card p{color:var(--dim)}

/* emergência */
.sos{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px}
@media(max-width:760px){.sos{grid-template-columns:repeat(2,1fr)}}
.sos a{text-decoration:none;border-radius:20px;padding:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;gap:4px;transition:background .25s,transform .25s}
.sos a:hover{background:rgba(244,115,111,.16);transform:translateY(-3px)}
.sos b{font-family:var(--display);font-weight:500;font-size:clamp(44px,5vw,64px);line-height:1;color:var(--ink)}
.sos span{font-size:14px;color:var(--dim)}
.pulse{width:16px;height:16px;border-radius:50%;background:var(--coral);display:inline-block;vertical-align:middle;margin-right:12px}
.js .pulse{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(244,115,111,.6)}100%{box-shadow:0 0 0 16px rgba(244,115,111,0)}}

/* anonimato */
.anon .card .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.anon .card .ic svg{width:22px;height:22px}

/* cidades */
.cities{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px}
@media(max-width:900px){.cities{grid-template-columns:repeat(2,1fr)}}
.city{border-radius:20px;padding:22px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;position:relative;overflow:hidden;color:var(--night)}
.city::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;border:14px solid rgba(255,255,255,.35)}
.city b{font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:26px;line-height:1}
.city span{font-size:14px;opacity:.8}

/* testar */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:40px 0}
@media(max-width:900px){.steps{grid-template-columns:1fr}}
.step{display:flex;gap:16px;align-items:flex-start}
.step .n{font-family:var(--display);font-weight:500;font-size:44px;line-height:.9;background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent;flex:none;width:36px}
.step p{color:var(--dim)}
.step b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
.progress-g{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.progress-g i{width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.progress-g i.on{background:var(--turq);border-color:var(--turq)}
.progress-g small{color:#AEB3C6;margin-left:10px;font-size:14px}
.ong{margin-top:64px;border-radius:24px;padding:clamp(24px,4vw,44px);background:linear-gradient(135deg,rgba(92,201,180,.14),rgba(174,150,242,.14));border:1px solid rgba(255,255,255,.14);display:grid;grid-template-columns:1.3fr .7fr;gap:28px;align-items:center}
@media(max-width:860px){.ong{grid-template-columns:1fr}}

footer{background:var(--night2);color:#AEB3C6;padding:48px 0 40px;font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:center;justify-content:space-between}
footer nav{display:flex;flex-wrap:wrap;gap:10px 22px}
footer a{text-decoration:none}footer a:hover{color:var(--ink)}
footer .sos-line{width:100%;color:var(--ink);font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:13px}

/* revelar ao rolar (só com JS; sem JS tudo aparece) */
.js .rv{opacity:0;transform:translateY(28px);filter:blur(6px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1),filter .9s ease}
.js .rv.in{opacity:1;transform:none;filter:none}
.js .rv.d1{transition-delay:.1s}.js .rv.d2{transition-delay:.2s}.js .rv.d3{transition-delay:.3s}.js .rv.d4{transition-delay:.4s}
.js .rule.rv{transform:scaleX(0);transform-origin:left;filter:none}.js .rule.rv.in{transform:none}
.js .hero h1 .w{display:inline-block;opacity:0;transform:translateY(.35em);filter:blur(10px);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.7,.2,1),filter .8s ease}
.js .hero.in h1 .w{opacity:1;transform:none;filter:none}
.js .float{animation:float 7s ease-in-out infinite}
.js .float.b{animation-delay:-3.2s}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -12px}}
.js .rb i::after{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1) .6s}
.js .in .rb i::after{width:var(--f,100%)}
.js .bar i{width:0!important;transition:width 1s cubic-bezier(.2,.7,.2,1) .6s}
.js .in .bar i{width:var(--w)!important}
.radar .blip{animation:blip 5s ease-out infinite;transform-box:fill-box;transform-origin:center}
.radar .blip.b2{animation-delay:1.7s}.radar .blip.b3{animation-delay:3.3s}
@keyframes blip{0%{opacity:.35;transform:scale(1)}8%{opacity:1;transform:scale(1.6)}30%{opacity:.9;transform:scale(1)}100%{opacity:.35}}
@media (prefers-reduced-motion:reduce){
  .js .rv,.js .hero h1 .w{opacity:1!important;transform:none!important;filter:none!important;transition:none!important}
  .js .float,.js .hero::before,.js .hero::after,.js .marquee .track,.js .pulse,.radar .blip,.siren{animation:none!important}
}

/* ---- botões que abrem detalhes ---- */
.xp-row{display:flex;flex-wrap:wrap;gap:10px}
.xp-btn{--a:var(--turq);position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;gap:12px;padding:11px 18px 11px 11px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:13.5px;text-align:left;line-height:1.3;cursor:pointer;
  transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s,box-shadow .35s,color .35s;-webkit-tap-highlight-color:transparent}
.xp-btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--a);opacity:.18;transform:scaleX(0);transform-origin:left;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.xp-btn::after{content:"";position:absolute;inset:-1px;z-index:-1;border-radius:inherit;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);transition:transform .9s ease}
.xp-btn:hover{transform:translateY(-2px);border-color:var(--a);box-shadow:0 12px 28px -16px var(--a)}
.xp-btn:hover::after{transform:translateX(120%)}
.xp-btn[aria-expanded=true]{border-color:var(--a)}
.xp-btn[aria-expanded=true]::before{transform:scaleX(1)}
.xp-btn:focus-visible,.xc-h:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.dark .xp-btn{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.16);color:var(--ink)}
.dark .xp-btn::before{opacity:.26}
.dark .xp-btn:hover,.dark .xp-btn[aria-expanded=true]{border-color:var(--a)}
.pm{position:relative;width:26px;height:26px;border-radius:50%;background:var(--a);flex:none;transition:transform .5s cubic-bezier(.3,1.4,.4,1)}
.pm::before,.pm::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:2px;margin:-1px 0 0 -5.5px;border-radius:2px;background:var(--night);transition:transform .45s cubic-bezier(.3,1.4,.4,1)}
.pm::after{transform:rotate(90deg)}
[aria-expanded=true]>.pm{transform:rotate(135deg)}
.js .xp-btn .pm{animation:nudge 3.6s ease-in-out infinite}
.js .xp-btn:nth-child(2) .pm{animation-delay:.4s}.js .xp-btn:nth-child(3) .pm{animation-delay:.8s}
.js [aria-expanded=true]>.pm,.js .xp-btn:hover .pm{animation:none}
@keyframes nudge{0%,80%,100%{box-shadow:0 0 0 0 transparent}88%{box-shadow:0 0 0 6px color-mix(in srgb,var(--a) 30%,transparent)}}

/* painel: abre pela altura, o conteúdo entra em sequência */
.xp{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .65s cubic-bezier(.2,.7,.2,1),opacity .45s ease,margin .5s ease;margin-top:0}
.xp>div{overflow:hidden;min-height:0}
.xp.open{grid-template-rows:1fr;opacity:1;margin-top:18px}
.xp-in{position:relative;padding:4px 0 4px 20px;display:flex;flex-direction:column;gap:14px}
.xp-in::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--rainbow);background:linear-gradient(180deg,var(--coral),var(--orange),var(--yellow),var(--turq),var(--blue),var(--lilac));transform:scaleY(0);transform-origin:top;transition:transform .8s cubic-bezier(.2,.7,.2,1) .1s}
.xp.open .xp-in::before{transform:none}
.xp .st{opacity:0;transform:translateY(14px);filter:blur(5px);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.7,.2,1),filter .5s ease;transition-delay:calc(.12s + var(--i,0) * .07s)}
.xp.open .st{opacity:1;transform:none;filter:none}
.xp-in p{color:var(--muted);font-size:16px;max-width:60ch}
.dark .xp-in p{color:var(--muted)}
.note{font-size:15px!important}
.checks li span b{color:var(--ink);font-weight:500}
.dark .checks li span b{color:var(--ink)}
.dark .checks li{color:var(--muted)}
.mini{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mini small{font-family:var(--display);text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--yellow);width:100%}
.mini span{padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.22);font-size:14px;color:var(--ink)}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.svc>div{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.svc b{font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--turq);font-size:15px}
.svc span{font-size:14.5px;color:var(--muted)}
.mural{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mural>div{padding:16px;border-radius:16px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;gap:8px}
.mural>div p{color:var(--ink)!important;font-size:15px}
.badge-l{align-self:flex-start;font-size:12px;font-weight:500;padding:3px 9px;border-radius:6px;color:var(--night)}

/* cartões que abrem */
.xc{--a:var(--turq);background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .35s;align-self:start}
.xc:hover{transform:translateY(-3px);box-shadow:0 20px 44px -26px rgba(30,35,64,.4)}
.xc:has([aria-expanded=true]){border-color:var(--a);box-shadow:0 20px 44px -26px var(--a)}
.xc-h{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:14px;padding:20px 22px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.xc-h h3{flex:1;text-align:left;font-size:17px;line-height:1.25}
.xc-h .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .5s cubic-bezier(.3,1.4,.4,1)}
.xc-h .ic svg{width:22px;height:22px}
.xc-h[aria-expanded=true] .ic{transform:rotate(-8deg) scale(1.08)}

@media (prefers-reduced-motion:reduce){.xp,.xp .st,.xp-in::before,.pm,.pm::before,.pm::after,.xp-btn::before{transition:none!important;animation:none!important}}

/* ---- inscrição no teste ---- */
.signup{position:relative;margin-top:36px;max-width:620px;display:flex;flex-direction:column;gap:14px}
.seg{position:relative;display:inline-flex;align-self:flex-start;padding:4px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.seg label{position:relative;z-index:1;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:9px 20px;font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--dim);transition:color .35s}
.seg input:checked+span{color:var(--night)}
.seg input:focus-visible+span{outline:2px solid var(--turq);outline-offset:2px;border-radius:999px}
.seg-bg{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:var(--w,50%);border-radius:999px;background:var(--turq);transform:translateX(var(--x,0));transition:transform .5s cubic-bezier(.3,1.3,.4,1),width .5s cubic-bezier(.3,1.3,.4,1),background .4s}
.seg.ios .seg-bg{background:var(--lilac)}
.field{position:relative;display:flex;gap:10px;padding:8px;border-radius:20px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.16);transition:border-color .35s,box-shadow .35s,background .35s}
.field:focus-within{border-color:var(--turq);background:rgba(255,255,255,.09);box-shadow:0 0 0 6px rgba(92,201,180,.14),0 20px 50px -24px rgba(92,201,180,.6)}
.field::before{content:"";position:absolute;inset:-1.5px;border-radius:inherit;padding:1.5px;background:linear-gradient(90deg,var(--coral),var(--orange),var(--yellow),var(--turq),var(--blue),var(--lilac),var(--coral));background-size:200% 100%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .4s;pointer-events:none}
.field:focus-within::before{opacity:1}
.js .field:focus-within::before{animation:flow 3s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.field input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font:500 18px/1.2 var(--body);padding:12px 14px}
.field input::placeholder{color:#8E94AA}
.field .btn{flex:none;position:relative;padding:14px 22px}
.field .btn .spin{position:absolute;inset:0;margin:auto;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(30,35,64,.25);border-top-color:var(--night);opacity:0}
.signup.sending .btn .btl{opacity:0}.signup.sending .btn .spin{opacity:1;animation:girar .8s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.signup.erro .field{border-color:var(--coral);animation:shake .45s cubic-bezier(.3,.9,.3,1)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.hint{font-size:14.5px;color:#AEB3C6!important;transition:color .3s}
.signup.erro .hint{color:#FFB3AF!important}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.done{position:absolute;inset:0;display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:22px;background:linear-gradient(135deg,rgba(92,201,180,.18),rgba(174,150,242,.18));border:1.5px solid rgba(92,201,180,.5);opacity:0;visibility:hidden;transform:scale(.96);transition:opacity .5s ease .15s,transform .6s cubic-bezier(.3,1.3,.4,1) .15s,visibility 0s .6s}
.done svg{width:52px;height:52px;flex:none}
.done circle{fill:none;stroke:var(--turq);stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;transition:stroke-dashoffset .8s cubic-bezier(.6,0,.3,1) .35s}
.done path{fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:36;stroke-dashoffset:36;transition:stroke-dashoffset .45s ease 1s}
.done b{display:block;font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.1em;font-size:20px;color:var(--ink)}
.done span{color:var(--muted);font-size:15.5px}
.signup.ok>:not(.done){opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.signup.ok .done{opacity:1;visibility:visible;transform:none;transition:opacity .5s ease .15s,transform .6s cubic-bezier(.3,1.3,.4,1) .15s,visibility 0s}
.signup.ok .done circle,.signup.ok .done path{stroke-dashoffset:0}
.confete{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:60}
@media(max-width:560px){.field{flex-direction:column;padding:8px}.field .btn{justify-content:center}.done{position:relative;inset:auto}.signup.ok>:not(.done){display:none}}
@media (prefers-reduced-motion:reduce){.seg-bg,.field,.done,.done circle,.done path{transition:none!important;animation:none!important}}

*{box-sizing:border-box}
body{margin:0;background:#e9e9ec;font-family:var(--body);display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px 0}
p{margin:0}
/* Marca oficial: SVG do radar.svgfrag (via <use href="#radarmark">) em qualquer uso >= 30px.
   O círculo liso (span.mark) só serve pra usos MENORES que 30px (ex.: ph-hdr, 20px). A versão
   reduzida (#radarmin, só o anel colorido sem detalhe interno) é uma variante deliberada, usável
   em qualquer tamanho >= 30px desde que venha sempre acompanhada do nome "Irisa" ao lado (nunca
   sozinha) — é o padrão do rodapé .brand desde o Liquid Glass. */
.mark{width:36px;height:36px;flex:none;display:block}
span.mark{border-radius:50%;background:conic-gradient(from -90deg,var(--coral),var(--orange),var(--yellow),var(--turq),var(--blue),var(--lilac),var(--coral));position:relative}
span.mark::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--night2)}
span.mark::before{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#fff;z-index:1}

.sl{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 80px}
/* Lâmina noite — xadrez da grade. Mesma gramática, papel virado: só troca os tokens. */
.sl.night{--paper:#141829;--surface:rgba(255,255,255,.08);--subtle:rgba(255,255,255,.06);--border:rgba(255,255,255,.14);--ink:#FFFFFF;--muted:#C8CCDC;--dim:#8E96AE;
  --coralInk:#FF8D89;--orangeInk:#FFBB7A;--yellowInk:#FFDE95;--turqInk:#6FE7D0;--lilacInk:#C3ABFF;
  --pane:rgba(255,255,255,.08);--pane-edge:rgba(255,255,255,.16);
  --shadow-card:0 2px 4px rgba(0,0,0,.22),0 18px 44px rgba(0,0,0,.34);
  --glass-inset:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px var(--pane-edge);
  background:var(--paper);color:var(--ink)}
.sl.night .bg{opacity:.85;mix-blend-mode:screen;filter:saturate(.8)}
.sl.night .dark{background:rgba(255,255,255,.08);box-shadow:var(--shadow-card),var(--glass-inset)}
.sl.night .ct,.sl.night .btn{color:#141829}
.sl>*{position:relative}
/* manchas de cor no fundo, no lugar do halo/grain do padrão escuro antigo */
.bg{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(60% 32% at -6% 0%,color-mix(in srgb,var(--turq) 40%,transparent),transparent 62%),
  radial-gradient(50% 28% at 106% 8%,color-mix(in srgb,var(--coral) 32%,transparent),transparent 62%),
  radial-gradient(55% 30% at 104% 100%,color-mix(in srgb,var(--lilac) 38%,transparent),transparent 62%),
  radial-gradient(45% 26% at -4% 100%,color-mix(in srgb,var(--yellow) 36%,transparent),transparent 62%)}
.c{text-align:center}
.eyebrow{font-family:var(--body);font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:28px;color:var(--dim)}
.disp{font-family:var(--display);text-transform:uppercase;font-weight:500;letter-spacing:.04em;line-height:.95;margin:0}
.big{font-family:var(--display);text-transform:uppercase;font-weight:700;letter-spacing:.01em;line-height:1.14;margin:0;color:var(--ink)}
.big .lt{font-weight:400}
.rainbow{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{height:12px;border-radius:6px;background:var(--rainbow)}
.wm{font-family:var(--wordmark);font-weight:600;text-transform:uppercase;letter-spacing:.2em;font-size:120px;line-height:1}
.wm b{font-weight:600;color:var(--amber)}
.small{font-family:var(--display);text-transform:uppercase;letter-spacing:.26em;font-size:28px;color:var(--turqInk)}
.body{font-size:38px;line-height:1.4;color:var(--muted);max-width:860px}

/* cartão de vidro — base de qualquer bloco antes destacado com fundo translúcido escuro */
.pane{background:var(--pane);border-radius:var(--r-xl);box-shadow:var(--shadow-card),var(--glass-inset);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}

.pill{display:inline-flex;align-items:center;gap:14px;padding:18px 30px;border-radius:999px;font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:30px;color:var(--night)}
.ct{padding:16px 28px;border-radius:22px;font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:38px;color:var(--night)}
.chip{display:inline-block;padding:14px 26px;border-radius:999px;font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:26px;border:2px solid var(--border);color:var(--muted);margin:6px}

.nring{position:relative;width:520px;height:520px;border-radius:50%}
.nring .fill{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--coral),var(--orange),var(--yellow),var(--turq),var(--blue),var(--lilac),var(--coral));-webkit-mask:conic-gradient(#000 94%,transparent 0);mask:conic-gradient(#000 94%,transparent 0)}
.nring .track{position:absolute;inset:0;border-radius:50%;background:var(--subtle)}
.nring .hole{position:absolute;inset:66px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.nring b{font-family:var(--display);font-weight:600;font-size:190px;line-height:1;color:var(--ink)}
.badge-big{padding:16px 34px;border-radius:18px;background:rgba(92,201,180,.16);color:var(--turqInk);font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:38px}

.num{position:absolute;top:48px;right:64px;font-family:var(--display);font-size:26px;letter-spacing:.2em;color:var(--dim)}
.swipe{position:absolute;bottom:56px;right:60px;display:flex;align-items:center;gap:14px;font-family:var(--display);text-transform:uppercase;letter-spacing:.2em;font-size:26px;color:var(--dim)}
.swipe svg{width:40px;height:40px}
.brand{position:absolute;bottom:56px;left:60px;display:flex;align-items:center;gap:14px;font-family:var(--wordmark);font-weight:500;text-transform:uppercase;letter-spacing:.2em;font-size:28px;color:var(--ink)}
.brand b{font-weight:500;color:var(--amber)}
.brand svg.mark{width:32px;height:32px}

.crit{display:grid;grid-template-columns:1fr 1fr;gap:22px;width:860px}
.crit div{padding:30px 34px;border-radius:var(--r-lg);background:var(--pane);box-shadow:var(--shadow-card),var(--glass-inset);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.crit b{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:34px;margin-bottom:8px;color:var(--ink)}
.crit span{font-size:28px;line-height:1.3;color:var(--muted)}

.two{display:flex;flex-direction:column;gap:32px;width:900px}
.two div{padding:44px 48px;border-radius:var(--r-xl);background:var(--pane);box-shadow:var(--shadow-card),var(--glass-inset);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.two h3{font-family:var(--display);text-transform:uppercase;font-weight:600;font-size:74px;line-height:1;letter-spacing:.03em;margin:0 0 16px;color:var(--ink)}
.two p{margin:0;font-size:32px;line-height:1.35;color:var(--muted)}

.slam{font-family:var(--display);text-transform:uppercase;font-weight:700;font-size:150px;line-height:1;letter-spacing:.03em}
.pct{font-family:var(--display);font-weight:700;font-size:220px;line-height:1;letter-spacing:-.02em}
.mono{font-family:var(--display);font-weight:700;font-size:200px;line-height:1;letter-spacing:-.02em}

.qcard{width:880px;padding:56px 60px;border-radius:var(--r-xl);background:var(--pane);box-shadow:var(--shadow-card),var(--glass-inset);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.qcard p{margin:0;font-size:44px;line-height:1.35;color:var(--ink)}

.stars{font-size:150px;letter-spacing:.06em;color:var(--border);position:relative;display:inline-block;line-height:1}
.stars::after{content:"";position:absolute;left:-4%;right:-4%;top:50%;height:14px;border-radius:7px;background:var(--coral);transform:rotate(-6deg)}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;max-width:900px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;width:900px}
.grid2 div{padding:34px 30px;border-radius:var(--r-xl);text-align:center;background:var(--pane);box-shadow:var(--shadow-card),var(--glass-inset);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.grid2 b{display:block;font-family:var(--display);font-weight:700;font-size:130px;line-height:1;color:var(--ink)}
.grid2 span{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:28px;color:var(--dim);margin-top:10px}

.list{display:flex;flex-direction:column;gap:20px;width:900px}
.list div{padding:28px 36px;border-radius:var(--r-lg);text-align:left;background:var(--pane);box-shadow:var(--shadow-card),var(--glass-inset);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.list b{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:36px;font-weight:700;line-height:1.1;color:var(--ink)}
.list span{display:block;font-size:27px;line-height:1.3;color:var(--muted);margin-top:6px}

.strike{position:relative;display:inline-block}
.strike::after{content:"";position:absolute;left:-3%;right:-3%;top:52%;height:12px;border-radius:6px;background:var(--coral);transform:rotate(-4deg)}

.btn-sos{display:inline-flex;align-items:center;gap:22px;padding:34px 60px;border-radius:32px;background:var(--coral);color:var(--night);font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:48px;box-shadow:0 30px 80px -20px rgba(255,105,100,.6)}

.lvl{display:flex;gap:24px}
.lvl div{padding:30px 40px;border-radius:var(--r-xl);text-align:center;width:300px}
.lvl b{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:40px;font-weight:700;color:var(--ink)}
.lvl span{font-size:26px;color:var(--muted)}

.map{position:relative;width:880px;height:520px;border-radius:var(--r-xl);background:var(--surface);overflow:hidden;box-shadow:var(--shadow-card)}
.map .st{position:absolute;background:var(--subtle)}
.map .pin{position:absolute;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px;color:var(--night)}
.map .ring{position:absolute;border-radius:50%;border:4px dashed rgba(255,105,100,.7);background:rgba(255,105,100,.14)}

.ph-wrap{position:absolute;left:50%}
.ph-wrap .caption{display:none}
.ph-wrap .phone{zoom:1.36;box-shadow:0 40px 90px -30px rgba(20,24,41,.35)}
.sosr{display:flex;gap:18px}
.sosr div{width:210px;padding:22px 0;border-radius:26px;background:var(--surface);box-shadow:var(--shadow-card);text-align:center}
.sosr b{display:block;font-family:var(--display);font-weight:700;font-size:84px;line-height:1;color:var(--ink)}
.sosr span{font-size:24px;color:var(--muted)}
.fl{position:absolute;font-size:28px;padding:16px 26px;box-shadow:var(--shadow-card);rotate:var(--r)}
.bub{max-width:760px;padding:30px 38px;border-radius:44px;font-size:42px;line-height:1.3}
.bub.me{align-self:flex-end;background:var(--turq);color:var(--night);border-bottom-right-radius:12px}
.bub.them{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow-card);color:var(--ink);border-bottom-left-radius:12px}
.typing{display:flex;gap:12px;padding:34px 40px}
.typing i{width:18px;height:18px;border-radius:50%;background:var(--dim);display:block}

/* story */
.sl.story{height:1920px;padding-top:120px;padding-bottom:120px}
.sl.story .brand{bottom:80px}
.zone{width:640px;height:150px;border:4px dashed var(--border);border-radius:40px;display:flex;align-items:center;justify-content:center;font-family:var(--display);text-transform:uppercase;letter-spacing:.2em;font-size:28px;color:var(--dim);margin-top:60px}
</style>
