<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo Irise — camada permanente</title>
<!-- Protótipo navegável: Irise como guia permanente do IRISA (onboarding, tour, gamificação,
     estados vazios, perfil). Proposta para aprovação, NADA implementado em produção, nenhuma
     regra de negócio/avaliação/gamificação alterada. Arte do Irise aqui é placeholder vetorial
     (composição de camadas: corpo+cabelo+rosto+acessório+estado), não a ilustração final do
     moodboard — ver nota no painel lateral. Tour de 24 passos + navegação livre nos pickers. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500&family=Oswald:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F5F4F1;--stage:#ECEAE5;--subtle:#F1F5FA;--border:#E6ECF3;--night:#141829;--night2:#20253A;
  --ink:#141829;--muted:#3D4560;--dim:#7C8296;--soft:#C9CDE0;
  --coral:#FF6964;--orange:#FFA353;--yellow:#FFD066;--turq:#49DCC0;--blue:#59A7FF;--lilac:#A889FF;
  --coralInk:#C72825;--turqInk:#0A8B7A;--amber:#E0A32E;
  --rb:linear-gradient(90deg,#FF6964,#FFA353,#FFD066,#49DCC0,#59A7FF,#A889FF);
  --display:"Oswald","Arial Narrow",Impact,sans-serif;--body:"Space Grotesk","Helvetica Neue",Arial,sans-serif;--mark:"Urbanist","Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 2px rgba(20,24,41,.04),0 10px 28px rgba(20,24,41,.08);
  --ease:cubic-bezier(.2,.7,.2,1);--spring:cubic-bezier(.3,1.4,.45,1);
}
*{box-sizing:border-box}p,h1,h2,h3{margin:0}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--body);color:var(--ink);background:var(--stage);-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(50% 45% at 0% 0%,rgba(73,220,192,.28),transparent 65%),radial-gradient(45% 40% at 100% 0%,rgba(255,105,100,.2),transparent 65%),
  radial-gradient(50% 45% at 100% 100%,rgba(168,137,255,.26),transparent 65%),radial-gradient(45% 40% at 0% 100%,rgba(255,208,102,.24),transparent 65%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--turq);outline-offset:3px}

/* ---------- palco ---------- */
#app{position:relative;height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding-inline:24px}
#stageWrap{position:relative;flex:none}
#phone{position:relative;width:390px;height:844px;border-radius:62px;background:#0E1020;padding:12px;box-shadow:0 40px 80px rgba(20,24,41,.28),0 0 0 2px #2A2E44 inset}
#screen{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:var(--paper);isolation:isolate}
#screen:before{content:"";position:absolute;inset:0;z-index:0;background:
  radial-gradient(70% 34% at -10% -2%,rgba(73,220,192,.34),transparent 64%),radial-gradient(60% 30% at 110% 4%,rgba(255,105,100,.26),transparent 64%),
  radial-gradient(70% 34% at 108% 100%,rgba(168,137,255,.32),transparent 64%),radial-gradient(60% 30% at -8% 98%,rgba(255,208,102,.3),transparent 64%)}
.island{position:absolute;left:50%;top:11px;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#000;z-index:60}
.sb{position:relative;z-index:50;height:48px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px 36px;font-weight:600;font-size:14px}
.hd{position:relative;z-index:5;margin:4px 14px 0;height:54px;border-radius:27px;background:rgba(255,255,255,.66);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;padding:0 7px 0 14px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--mark);font-weight:500;letter-spacing:.2em;font-size:18px}
.logo b{font-weight:500;color:var(--amber)}
.sos{width:40px;height:40px;border-radius:50%;background:var(--coral);display:flex;align-items:center;justify-content:center;flex:none}
#stageBody{position:absolute;inset:0;z-index:1}
.scr{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}
.pad{padding:12px 14px 120px;display:flex;flex-direction:column;gap:12px}
.cd{background:rgba(255,255,255,.72);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.cd.dk{background:var(--night2);color:#F1F0EC}
.btn{height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;gap:8px;width:100%}
.btn:active{transform:scale(.97)}
.chip{display:inline-flex;align-items:center;height:38px;padding:0 15px;border-radius:19px;background:var(--subtle);font-size:13.5px;font-weight:600;gap:6px}
.chip.on{background:var(--night);color:#fff}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.tb{position:absolute;left:14px;right:14px;bottom:20px;z-index:20;height:64px;border-radius:32px;background:rgba(255,255,255,.8);box-shadow:var(--shadow);display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(16px)}
.tb button{width:58px;height:56px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--muted)}
.tb button.on{background:#fff;box-shadow:0 4px 14px rgba(20,24,41,.1);font-weight:600;color:var(--coralInk)}

/* ---------- avatar Irise (composição por camadas) ---------- */
.ir-wrap{position:relative;display:inline-block}
.ir-halo{position:absolute;inset:-18%;border-radius:50%;opacity:.9;filter:blur(.3px)}
.ir-fig{position:relative;display:block}
.ir-body{position:absolute;left:50%;bottom:0;border-radius:46% 46% 18% 18%;transform:translateX(-50%)}
.ir-outfit{position:absolute;left:50%;border-radius:40% 40% 0 0;transform:translateX(-50%)}
.ir-head{position:absolute;left:50%;border-radius:50%;transform:translateX(-50%)}
.ir-hair{position:absolute;left:50%;transform:translateX(-50%)}
.ir-eye{position:absolute;width:6px;height:6px;border-radius:50%;background:#141829}
.ir-mouth{position:absolute;border:0;border-bottom:3px solid #141829;border-radius:50%}
.ir-acc{position:absolute}
.ir-badge{position:absolute;right:-6px;top:-4px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:15px}

/* bolha de fala do Irise */
.ir-say{display:flex;gap:10px;align-items:flex-end}
.ir-bubble{background:#fff;border-radius:18px 18px 18px 5px;padding:11px 14px;font-size:14px;line-height:1.4;box-shadow:var(--shadow);max-width:230px}
.ir-bubble b{font-weight:700}

/* folha/painel flutuante com Irise comentando por cima da tela */
.ir-panel{position:absolute;left:14px;right:14px;bottom:96px;z-index:25;display:flex;gap:10px;align-items:flex-end}

/* spotlight simples sobre elemento apontado */
.ptr{position:absolute;border:2px dashed var(--turqInk);border-radius:16px;pointer-events:none;opacity:.9}

/* ---------- fundos de tela cheia (onboarding) ---------- */
.full{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 26px;gap:14px}
.full .eb{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--turqInk)}
.full h1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:30px;line-height:1.08}
.full h1 .rb{background:var(--rb);-webkit-background-clip:text;background-clip:text;color:transparent}
.full p{font-size:14.5px;line-height:1.5;color:var(--muted);max-width:280px}

/* escolha de pronome */
.optlist{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px}
.optbtn{height:52px;border-radius:18px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600}
.optbtn.on{background:var(--night);color:#fff}

/* carrossel de Irisis */
.carousel{display:flex;align-items:center;justify-content:center;gap:16px;width:100%}
.carwrap{position:relative;width:180px;height:220px;display:flex;align-items:center;justify-content:center}
.navc{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;flex:none}
.dots7{display:flex;gap:6px;justify-content:center}
.dots7 i{width:7px;height:7px;border-radius:50%;background:var(--border)}
.dots7 i.on{background:var(--night);width:16px;border-radius:4px;transition:width .25s}

/* perfil */
.lr{display:flex;flex-direction:column;gap:3px;padding:14px 0;border-bottom:1px dashed rgba(20,24,41,.15)}
.lr b{font-size:15px}.lr small{font-size:12.5px;line-height:1.4;color:var(--dim)}
.seg3{display:flex;flex-direction:column;gap:8px}
.tonebtn{border-radius:16px;padding:12px 14px;background:#fff;box-shadow:var(--shadow);text-align:left}
.tonebtn.on{background:var(--night);color:#fff}
.tonebtn b{display:block;font-size:14px}
.tonebtn span{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.tonebtn.on span{color:var(--soft)}

/* overlay de celebração */
.ovl{position:absolute;inset:0;z-index:40;background:var(--night);color:#F1F0EC;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:10px}
.ovl h1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:34px;line-height:1.05;color:#fff}
.ovl p{font-size:14.5px;line-height:1.5;color:var(--soft);max-width:270px}

/* painel lateral (tour) */
#tour{width:400px;flex:none;background:rgba(255,255,255,.86);border-radius:30px;padding:26px 26px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(20px)}
#tour .top{display:flex;justify-content:space-between;align-items:center}
#tour .mark{font-family:var(--mark);font-weight:500;letter-spacing:.2em;font-size:14px;color:var(--muted)}
#tour .mark b{color:var(--amber);font-weight:500}
#tour .count{font-size:13px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}
#tour .bar{height:6px;border-radius:3px;background:var(--subtle);overflow:hidden}
#tour .bar i{display:block;height:100%;width:0;background:var(--rb);border-radius:3px;transition:width .4s var(--ease)}
#tour .eb{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--turqInk)}
#tour h2{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:26px;line-height:1.08}
#tour .txt{font-size:14.5px;line-height:1.5;color:var(--muted);min-height:70px}
#tour .nav{display:flex;gap:10px;margin-top:4px}
.tbtn{height:46px;border-radius:23px;padding:0 20px;font-weight:600;font-size:14px}
.tbtn.pri{background:var(--night);color:#fff;flex:1}
.tbtn.sec{background:var(--subtle)}
.tbtn:disabled{opacity:.35}
#tour .note{font-size:12px;color:var(--dim);line-height:1.5;border-top:1px solid var(--border);padding-top:10px;margin-top:4px}

@media (max-width:900px){
  #app{flex-direction:column;gap:10px;padding-top:10px;overflow:auto}
  #tour{width:auto;margin:0 16px 20px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap"><div id="phone"><div id="screen">
    <div class="island"></div>
    <div id="stageBody"></div>
  </div></div></div>

  <aside id="tour">
    <div class="top"><span class="mark">IRIS<b>A</b> · IRISE</span><span class="count" id="tCount">1 / 24</span></div>
    <div class="bar"><i id="tBar"></i></div>
    <p class="eb" id="tEb"></p>
    <h2 id="tH"></h2>
    <p class="txt" id="tTxt"></p>
    <div class="nav"><button class="tbtn sec" id="tPrev">Voltar</button><button class="tbtn pri" id="tNext">Próximo</button></div>
    <p class="note">Arte do Irise aqui é um placeholder vetorial em camadas (corpo · cabelo · rosto ·
    acessório · estado) — mesma lógica de <code>IRISE_VARIANT + STATE</code> pedida, só que composta em
    CSS, não a ilustração final do moodboard. Serve pra validar fluxo e tom antes de produzir a arte real.</p>
  </aside>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const stage=$("#stageBody");

/* ===================== ANEL DA MARCA (halo) ===================== */
const RB=['#FF6964','#FFA353','#FFD066','#49DCC0','#59A7FF','#A889FF'];
function ringSVG(size){
  let h=""; const n=24;
  for(let i=0;i<n;i++){const a0=(-90+15*i)*Math.PI/180,a1=a0+13*Math.PI/180;
    const pt=(r,a)=>(50+r*Math.cos(a)).toFixed(1)+" "+(50+r*Math.sin(a)).toFixed(1);
    h+=`<path d="M${pt(48,a0)}A48 48 0 0 1 ${pt(48,a1)}L${pt(38,a1)}A38 38 0 0 0 ${pt(38,a0)}Z" fill="${RB[i%6]}"/>`;}
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">${h}</svg>`;
}

/* ===================== VARIANTES DO IRISE ===================== */
// Diversidade proposital: corpo, cabelo, tom de pele e acessório variam; nenhum pronome é atribuído.
const VARIANTS=[
  {id:"irise_01", skin:"#C98657", hair:"#1B1B1B", hairShape:"afro",    body:"wide",   acc:"none",       outfit:"var(--coral)"},
  {id:"irise_02", skin:"#8A5A3B", hair:"#2B2017", hairShape:"bob",     body:"round",  acc:"earring",    outfit:"var(--turq)"},
  {id:"irise_03", skin:"#E8C39E", hair:"#D9A441", hairShape:"buzz",    body:"narrow", acc:"headphones", outfit:"var(--lilac)"},
  {id:"irise_04", skin:"#4A3326", hair:"#120F0C", hairShape:"long",    body:"soft",   acc:"none",       outfit:"var(--yellow)"},
  {id:"irise_05", skin:"#F0C9A0", hair:"#6B4226", hairShape:"undercut",body:"wide",   acc:"glasses",    outfit:"var(--orange)"},
  {id:"irise_06", skin:"#D9A066", hair:"#3A2A1D", hairShape:"headwrap",body:"narrow", acc:"cap",        outfit:"var(--blue)"},
  {id:"irise_07", skin:"#6E4A33", hair:"#161210", hairShape:"coily",   body:"round",  acc:"tattoo",     outfit:"var(--coral)"},
];
const BODY_W={wide:88,narrow:62,round:84,soft:78};
let SELECTED=0; // variante escolhida pelo usuário no protótipo

function hairMarkup(shape,color){
  const c=color;
  const shapes={
    afro:`<div style="position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:84px;height:70px;border-radius:50%;background:${c}"></div>`,
    bob:`<div style="position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:70px;height:56px;border-radius:50% 50% 40% 40%;background:${c}"></div>`,
    buzz:`<div style="position:absolute;left:50%;top:-2px;transform:translateX(-50%);width:58px;height:30px;border-radius:50% 50% 0 0;background:${c}"></div>`,
    long:`<div style="position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:76px;height:110px;border-radius:50% 50% 30% 30%;background:${c};z-index:-1"></div>`,
    undercut:`<div style="position:absolute;left:50%;top:-6px;transform:translateX(-62%);width:46px;height:40px;border-radius:50% 50% 10% 10%;background:${c}"></div>`,
    headwrap:`<div style="position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:72px;height:34px;border-radius:50% 50% 20% 20%;background:${c}"></div><div style="position:absolute;left:50%;top:14px;transform:translateX(-30%);width:18px;height:40px;border-radius:40%;background:${c}"></div>`,
    coily:`<div style="position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:66px;height:50px;border-radius:50%;background:${c}"></div><div style="position:absolute;left:50%;top:0;transform:translateX(-44%);width:14px;height:14px;border-radius:50%;background:${c}"></div><div style="position:absolute;left:50%;top:-2px;transform:translateX(26%);width:16px;height:16px;border-radius:50%;background:${c}"></div>`,
  };
  return `<div class="ir-hair" style="width:0;height:0">${shapes[shape]||shapes.afro}</div>`;
}
function accMarkup(acc,outfit){
  const m={
    none:"",
    glasses:`<div class="ir-acc" style="left:50%;top:58px;transform:translateX(-50%);width:40px;height:14px;border:2px solid #141829;border-radius:7px;background:rgba(255,255,255,.3)"></div>`,
    headphones:`<div class="ir-acc" style="left:50%;top:18px;transform:translateX(-50%);width:62px;height:30px;border:4px solid #141829;border-bottom:0;border-radius:50% 50% 0 0"></div>`,
    cap:`<div class="ir-acc" style="left:50%;top:-6px;transform:translateX(-50%);width:66px;height:28px;border-radius:50% 50% 10% 10%;background:${outfit}"></div><div class="ir-acc" style="left:50%;top:10px;transform:translateX(-10%);width:30px;height:10px;border-radius:6px;background:${outfit}"></div>`,
    earring:`<div class="ir-acc" style="left:50%;top:70px;transform:translateX(26px);width:6px;height:10px;border-radius:50%;background:var(--amber)"></div>`,
    tattoo:`<div class="ir-acc" style="left:50%;top:118px;transform:translateX(-30px);width:20px;height:4px;border-radius:2px;background:rgba(20,24,41,.4)"></div>`,
  };
  return m[acc]||"";
}
const STATES={
  welcome:     {emoji:"👋", eye:0, mouth:"smile", tilt:0},
  point:       {emoji:"👉", eye:-2, mouth:"smile", tilt:-4},
  search:      {emoji:"🔍", eye:1, mouth:"flat", tilt:3},
  thinking:    {emoji:"🤔", eye:1, mouth:"flat", tilt:-3},
  loading:     {emoji:"🌀", eye:0, mouth:"o", tilt:0},
  celebrate:   {emoji:"🎉", eye:-1, mouth:"grin", tilt:-5},
  achievement: {emoji:"🏅", eye:0, mouth:"grin", tilt:0},
  almost_there:{emoji:"👀", eye:0, mouth:"smirk", tilt:4},
  error:       {emoji:"😭", eye:0, mouth:"sad", tilt:0},
  no_data:     {emoji:"👀", eye:0, mouth:"flat", tilt:3},
  recommendation:{emoji:"✨", eye:0, mouth:"smile", tilt:-2},
  review:      {emoji:"🌈", eye:0, mouth:"smile", tilt:0},
  goodbye:     {emoji:"🖐️", eye:0, mouth:"smile", tilt:0},
};
function mouthStyle(kind){
  const m={
    smile:"width:18px;height:9px;border-radius:0 0 18px 18px",
    flat:"width:14px;height:0;border-bottom:3px solid #141829;border-radius:0",
    grin:"width:22px;height:12px;border-radius:0 0 22px 22px",
    o:"width:10px;height:10px;border-radius:50%;border:3px solid #141829",
    sad:"width:16px;height:8px;border-radius:18px 18px 0 0;border-bottom:0;border-top:3px solid #141829",
    smirk:"width:14px;height:7px;border-radius:0 0 14px 2px",
  };
  return m[kind]||m.smile;
}
function avatarHTML(variantIdx, state, size){
  size=size||140;
  const v=VARIANTS[variantIdx]; const st=STATES[state]||STATES.welcome;
  const bw=BODY_W[v.body];
  return `
  <div class="ir-wrap" style="width:${size}px;height:${size*1.18}px">
    <div class="ir-halo">${ringSVG(size*1.3)}</div>
    <div class="ir-fig" style="width:100%;height:100%;transform:rotate(${st.tilt}deg)">
      <div class="ir-body" style="width:${bw}px;height:${size*0.52}px;background:${v.skin}"></div>
      <div class="ir-outfit" style="bottom:0;width:${bw+6}px;height:${size*0.24}px;background:${v.outfit};left:50%;transform:translateX(-50%)"></div>
      <div class="ir-head" style="top:${size*0.06}px;width:${size*0.46}px;height:${size*0.46}px;background:${v.skin}">
        ${hairMarkup(v.hairShape, v.hair)}
        <div class="ir-eye" style="left:${size*0.15+st.eye}px;top:${size*0.19}px"></div>
        <div class="ir-eye" style="left:${size*0.30+st.eye}px;top:${size*0.19}px"></div>
        <div class="ir-mouth" style="left:50%;top:${size*0.30}px;transform:translateX(-50%);${mouthStyle(st.mouth)}"></div>
      </div>
      ${accMarkup(v.acc, v.outfit)}
    </div>
    <div class="ir-badge">${st.emoji}</div>
  </div>`;
}
function avatarInline(variantIdx,state,size){ return avatarHTML(variantIdx,state,size); }
function sayRow(variantIdx,state,text,size){
  return `<div class="ir-say">${avatarInline(variantIdx,state,size||64)}<div class="ir-bubble">${text}</div></div>`;
}

/* ===================== MOCKUPS DE TELA REUTILIZÁVEIS ===================== */
function chrome(active, inner){
  return `<div class="sb"><span>9:41</span><i></i></div>
  <div class="hd"><div class="logo">${ringSVG(22)}<span>IRIS<b>A</b></span></div><div class="sos"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141829" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18v-6a5 5 0 0 1 10 0v6"/><path d="M5 21h14v-3H5Z"/></svg></div></div>
  <div class="pad">${inner}</div>
  <div class="tb">${["Início","Mapa","Lugares","Apoio","Perfil"].map(n=>`<button class="${n===active?"on":""}">${n}</button>`).join("")}</div>`;
}

function ringMini(lit,total,colors){
  let h=""; const n=total;
  for(let i=0;i<n;i++){const a0=(-90+360/n*i+4)*Math.PI/180,a1=(-90+360/n*(i+1)-4)*Math.PI/180;
    const pt=(r,a)=>(50+r*Math.cos(a)).toFixed(1)+" "+(50+r*Math.sin(a)).toFixed(1);
    h+=`<path d="M${pt(48,a0)}A48 48 0 0 1 ${pt(48,a1)}L${pt(32,a1)}A32 32 0 0 0 ${pt(32,a0)}Z" fill="${i<lit?colors[i%colors.length]:"#E4E1DA"}"/>`;}
  return `<svg width="84" height="84" viewBox="0 0 100 100">${h}<circle cx="50" cy="50" r="13" fill="#0F1220"/></svg>`;
}

let CUR=0;
function renderStep(){
  const s=STEPS[CUR];
  $("#tEb").textContent=s.eb; $("#tH").textContent=s.h; $("#tTxt").textContent=s.t;
  $("#tCount").textContent=(CUR+1)+" / "+STEPS.length;
  $("#tBar").style.width=((CUR+1)/STEPS.length*100)+"%";
  $("#tPrev").disabled=CUR===0;
  s.r();
}
$("#tPrev").onclick=()=>{ if(CUR>0){ CUR--; renderStep(); } };
$("#tNext").onclick=()=>{ if(CUR<STEPS.length-1){ CUR++; renderStep(); } };
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight") $("#tNext").click();
  if(e.key==="ArrowLeft") $("#tPrev").click();
});
renderStep();
</script>
</body>
</html>
