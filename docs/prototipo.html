<style>
:root{
  --paper:#FAF9F6;--surface:#FFFFFF;--subtle:#F1EDE7;--border:#E4DED5;
  --night:#1E2340;--ink:#1E2340;--muted:#4F576F;--dim:#8A90A2;
  --coral:#F4736F;--orange:#F5A45D;--yellow:#F0CA75;--turquoise:#5CC9B4;--lilac:#AE96F2;
  --coralInk:#B23C3A;--orangeInk:#96601C;--yellowInk:#8A6512;--turquoiseInk:#1B7A6E;--lilacInk:#6D4FD8;
  --amber:#E0A32E;
  --display:"Oswald",Impact,sans-serif;--body:"Space Grotesk",Helvetica,Arial,sans-serif;--wordmark:"Urbanist",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#EDEAE3;font-family:var(--body);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 12px 40px}
.page-title{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:18px;margin:0}
.page-sub{font-size:13px;color:var(--muted);max-width:52ch;text-align:center;margin:0}
.phone{width:380px;max-width:100%;height:780px;max-height:88vh;background:var(--paper);border:10px solid #15182b;border-radius:42px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 24px 50px rgba(30,35,64,.28)}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:118px;height:26px;background:#15182b;border-radius:0 0 16px 16px;z-index:20}
header.bar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:38px 14px 10px;background:var(--paper)}
.logo{display:flex;align-items:center;gap:10px}
.logo .word{font-family:var(--wordmark);font-weight:500;text-transform:uppercase;font-size:24px;letter-spacing:.15em;line-height:1.1}
.logo .word i{font-style:normal;color:var(--yellow)}
.back{font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.08em;background:none;border:0;color:var(--ink);display:flex;align-items:center;gap:8px;cursor:pointer;padding:0}
.siren{position:relative;width:40px;height:40px;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.siren .halo{position:absolute;inset:0;border-radius:50%;background:var(--coral);animation:pulse 1.8s ease-out infinite}
.siren .dot{position:relative;width:40px;height:40px;border-radius:50%;background:var(--coral);display:grid;place-items:center}
.siren svg{width:20px;height:20px;stroke:var(--night);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.siren .halo{animation:none;opacity:0}}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 26px;display:flex;flex-direction:column;gap:16px;background:var(--paper);scrollbar-width:thin}
main>*{flex:0 0 auto}
.map{flex:0 0 auto}
nav.tabs{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--border);padding:8px 4px 20px}
nav.tabs button{flex:1;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--body);font-weight:500;font-size:11px;color:var(--dim);padding:2px 0}
nav.tabs button.on{color:var(--coralInk)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card.hero{border-radius:16px;padding:20px;gap:12px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
.display{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--ink);line-height:1.1}
.d36{font-size:34px}.d30{font-size:28px}.d24{font-size:22px}
.h{font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.14em;font-size:16px;color:var(--ink)}
.h-sm{font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--muted)}
.p{font-size:14px;color:var(--muted);line-height:1.45}
.small{font-size:12px;color:var(--dim)}
.link{background:none;border:0;padding:0;cursor:pointer;font-family:var(--body);font-weight:500;font-size:14px;color:var(--turquoiseInk);display:inline-flex;align-items:center;gap:4px}
.row{display:flex;gap:8px}
.row.wrap{flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{flex:1;border:0;cursor:pointer;border-radius:12px;padding:13px 10px;font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.14em;font-size:14px}
.btn:active{opacity:.8}
.btn.coral{background:var(--coral);color:var(--night)}
.btn.turq{background:var(--turquoise);color:var(--night)}
.btn.yellow{background:var(--yellow);color:var(--night)}
.btn.lilac{background:var(--lilac);color:var(--night)}
.btn.ghost-turq{background:transparent;border:1px solid var(--turquoise);color:var(--turquoiseInk)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn.sm{flex:none;padding:9px 14px;font-size:13px;border-radius:10px}
.chip{border-radius:999px;border:1px solid;padding:7px 13px;font-family:var(--body);font-weight:500;font-size:12px;background:transparent;cursor:pointer;white-space:nowrap}
.pill{border-radius:999px;padding:4px 12px;font-family:var(--body);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--night)}
.badge{align-self:flex-start;border-radius:6px;padding:3px 8px;font-family:var(--body);font-weight:500;font-size:11px}
.badge.lg{padding:4px 10px;font-size:13px}
input,textarea{width:100%;font-family:var(--body);font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:12px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--turquoise)}
textarea{min-height:92px;resize:none}
.stat{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:3px}
.stat .v{font-family:var(--display);font-weight:700;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:transparent;cursor:pointer;border-radius:9px;padding:9px;font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.14em;font-size:14px;color:var(--muted)}
.map{position:relative;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--subtle)}
.map canvas{display:block;width:100%;height:100%;cursor:crosshair}
.map .attr{position:absolute;right:6px;bottom:4px;font-size:9px;color:var(--dim)}
.rank{display:flex;align-items:center;gap:12px}
.rank .n{font-family:var(--display);font-weight:500;font-size:19px;color:var(--dim);width:22px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:6px;display:inline-block}
.tap{cursor:pointer}
.tap:active{opacity:.8}
.axis{display:flex;align-items:center;gap:8px}
.axis .lbl{width:84px;font-size:12px;color:var(--muted)}
.axis .val{flex:1;text-align:right;font-weight:500;font-size:12px;color:var(--ink)}
.strip{display:flex;gap:6px}
.strip i{flex:1;height:4px;border-radius:2px;background:var(--border);overflow:hidden;display:block}
.strip i b{display:block;height:100%;border-radius:2px}
.sheet-bg{position:absolute;inset:0;background:rgba(21,24,43,.55);z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--surface);border-top:1px solid var(--border);border-radius:22px 22px 0 0;padding:22px 22px 30px;display:flex;flex-direction:column;gap:14px;max-height:80%;overflow-y:auto}
.full-modal{position:absolute;inset:0;background:var(--paper);z-index:30;display:flex;flex-direction:column;gap:14px;padding:46px 16px 16px}
.emg{display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:12px;background:var(--paper);padding:12px 14px;cursor:pointer}
.emg .num{font-family:var(--display);font-weight:700;font-size:28px;color:var(--coralInk)}
.x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:26px;line-height:1;padding:0}
.list-item{border-bottom:1px solid var(--border);padding:12px 0;cursor:pointer;font-size:15px}
.hint{font-size:12px;color:var(--dim)}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:40;background:var(--night);color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;box-shadow:0 10px 24px rgba(0,0,0,.3);opacity:0;transform:translateY(8px);transition:.25s}
.toast.on{opacity:1;transform:none}
.warn{display:flex;gap:8px;align-items:flex-start;border:1px solid rgba(244,115,111,.6);border-radius:12px;background:var(--paper);padding:12px}
.note b{display:block;font-weight:700;font-size:14px;color:var(--turquoiseInk)}
.note.coral b{color:var(--coralInk)}
.foot{font-size:12px;color:var(--muted);text-align:center;max-width:52ch}
</style>
</head>

/* ---------- marca ---------- */
const RING=["#F4736F","#F5A45D","#F0CA75","#5CC9B4","#6AA8EE","#AE96F2"];
function lerp(a,b,t){let o="#";for(let i=1;i<7;i+=2){const x=parseInt(a.slice(i,i+2),16),y=parseInt(b.slice(i,i+2),16);o+=Math.round(x+(y-x)*t).toString(16).padStart(2,"0")}return o}
function pt(r,a){return{x:50+r*Math.cos(a),y:50+r*Math.sin(a)}}
function slice(ro,ri,a0,a1){const o0=pt(ro,a0),o1=pt(ro,a1),i1=pt(ri,a1),i0=pt(ri,a0);return `M ${o0.x} ${o0.y} A ${ro} ${ro} 0 0 1 ${o1.x} ${o1.y} L ${i1.x} ${i1.y} A ${ri} ${ri} 0 0 0 ${i0.x} ${i0.y} Z`}
function markSvg(size){
  const N=48,S0=-150*Math.PI/180,S1=-55*Math.PI/180;let p="";
  for(let i=0;i<N;i++){const t=i/N,q=t*RING.length,k=Math.floor(q)%RING.length;
    p+=`<path d="${slice(48,35,(i/N)*2*Math.PI-Math.PI/2,((i+1)/N)*2*Math.PI-Math.PI/2+0.05)}" fill="${lerp(RING[k],RING[(k+1)%RING.length],q-Math.floor(q))}"/>`}
  const s=pt(33,S0),e=pt(33,S1),id="g"+Math.random().toString(36).slice(2,7);
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100"><defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${s.x}" y1="${s.y}" x2="${e.x}" y2="${e.y}"><stop offset="0" stop-color="#5CC9B4" stop-opacity="0"/><stop offset="1" stop-color="#5CC9B4" stop-opacity=".5"/></linearGradient></defs>${p}
  <path d="${slice(33,0,S0,S1)}" fill="url(#${id})"/>
  <path d="M 50 50 L ${e.x} ${e.y}" stroke="#5CC9B4" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".75"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="#5CC9B4" stroke-width=".8" stroke-opacity=".35"/>
  <circle cx="66" cy="36" r="3.1" fill="#5CC9B4"/><circle cx="63" cy="62" r="2.4" fill="${C.coral}"/><circle cx="38" cy="34" r="1.9" fill="#5CC9B4"/>
  <circle cx="50" cy="50" r="13" fill="#161B2E"/><circle cx="46.1" cy="45.6" r="2.86" fill="#fff"/></svg>`;
}
function irisScore(value,size=54){
  const c=size/2,ro=size*.47,ri=size*.315,pu=size*.155;
  const P=(r,deg)=>{const a=(deg-90)*Math.PI/180;return{x:c+r*Math.cos(a),y:c+r*Math.sin(a)}};
  const ann=(a0,a1)=>{const o0=P(ro,a0),o1=P(ro,a1),i1=P(ri,a1),i0=P(ri,a0);return `M ${o0.x} ${o0.y} A ${ro} ${ro} 0 0 1 ${o1.x} ${o1.y} L ${i1.x} ${i1.y} A ${ri} ${ri} 0 0 0 ${i0.x} ${i0.y} Z`};
  let arcs="";
  SCALE.forEach((col,i)=>{const f=Math.max(0,Math.min(1,value-i));if(f>.01)arcs+=`<path d="${ann(i*72+0.6,i*72+72*f)}" fill="${col}"/>`});
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${c}" cy="${c}" r="${(ro+ri)/2}" fill="none" stroke="${C.border}" stroke-width="${ro-ri}"/>${arcs}<circle cx="${c}" cy="${c}" r="${pu}" fill="#161B2E"/><circle cx="${c-pu*.3}" cy="${c-pu*.32}" r="${pu*.22}" fill="${C.surface}"/></svg>`;
}
function rainbow(value,size=8,name){
  const w=Math.round(size*3.1),gap=Math.max(2,Math.round(size*.34));
  return `<div style="display:flex;gap:${gap}px">`+SCALE.map((col,i)=>{
    const f=Math.max(0,Math.min(1,value-i));
    const inner=f>0?`<span style="display:block;width:${Math.max(size,w*f)}px;height:${size}px;border-radius:${size/2}px;background:${col}"></span>`:"";
    const seg=`<span style="display:block;width:${w}px;height:${size}px;border-radius:${size/2}px;background:${C.border};overflow:hidden">${inner}</span>`;
    return name?`<button class="tap" style="border:0;background:none;padding:2px 0;cursor:pointer" data-rate="${name}" data-v="${i+1}">${seg}</button>`:seg;
  }).join("")+`</div>`;
}
function axisBars(sc,size=8){
  const shown=AXIS_KEYS.filter(k=>sc[k]!=null);if(!shown.length)return "";
  return `<div style="display:flex;flex-direction:column;gap:6px">`+shown.map(k=>`<div class="axis"><span class="lbl">${AXES[k].label}</span>${rainbow(Number(sc[k]),size)}<span class="val">${Number(sc[k]).toFixed(1)}</span></div>`).join("")+`</div>`;
}
function axisStrip(sc){
  if(AXIS_KEYS.some(k=>sc[k]==null))return "";
  return `<div class="strip">`+AXIS_KEYS.map((k,i)=>`<i><b style="width:${Math.max(6,Number(sc[k])/5*100)}%;background:${SCALE[i]}"></b></i>`).join("")+`</div>`;
}
function badgeHtml(key,lg){const b=BADGES[key];if(!b)return "";return `<span class="badge${lg?" lg":""}" style="background:${b.color}${key==="poucas"?"":"2E"};color:${b.ink}">${b.label}</span>`}

/* ---------- mapa sintético (claro, estilo Esri Light Gray) ---------- */
function drawMap(cv,opts){
  const x=cv.getContext("2d"),W=cv.width,H=cv.height;
  x.fillStyle="#F3F1ED";x.fillRect(0,0,W,H);
  let s=7;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
  x.fillStyle="#E8E5DE";for(let i=0;i<46;i++)x.fillRect(rnd()*W,rnd()*H,18+rnd()*70,12+rnd()*46);
  x.strokeStyle="#FFFFFF";x.lineWidth=3;
  for(let i=0;i<9;i++){const y=rnd()*H;x.beginPath();x.moveTo(0,y);x.lineTo(W,y+(rnd()-.5)*60);x.stroke()}
  for(let i=0;i<9;i++){const xx=rnd()*W;x.beginPath();x.moveTo(xx,0);x.lineTo(xx+(rnd()-.5)*60,H);x.stroke()}
  x.strokeStyle="#DCD8D0";x.lineWidth=5;x.beginPath();x.moveTo(0,H*.55);x.lineTo(W,H*.4);x.stroke();
  x.beginPath();x.moveTo(W*.35,0);x.lineTo(W*.45,H);x.stroke();
  if(opts.heat!==false){
    for(const[px,py,r,col] of [[.42,.45,46,C.coral],[.62,.3,34,C.orange],[.25,.7,24,C.yellow],[.75,.7,19,C.yellow]]){
      x.globalAlpha=.28;x.fillStyle=col;x.beginPath();x.arc(px*W,py*H,r,0,7);x.fill();x.globalAlpha=1}
  }
  if(opts.occurrences!==false){
    for(const[px,py,col,r] of [[.4,.43,C.coral,7],[.45,.48,C.orange,5],[.38,.5,C.yellow,5],[.6,.3,C.coral,7],[.66,.34,C.yellow,5],[.25,.7,C.orange,5],[.75,.72,C.yellow,5],[.55,.6,C.orange,5],[.3,.3,C.yellow,5]]){
      x.fillStyle=col;x.beginPath();x.arc(px*W,py*H,r,0,7);x.fill();x.lineWidth=1.5;x.strokeStyle="#fff";x.stroke()}
  }
  if(opts.places){
    for(const[px,py,col] of [[.5,.25,C.turquoise],[.2,.5,C.turquoise],[.8,.5,C.yellow],[.65,.85,C.dim],[.35,.85,C.coral]]){
      x.globalAlpha=.2;x.fillStyle=col;x.beginPath();x.arc(px*W,py*H,14,0,7);x.fill();x.globalAlpha=1;
      x.beginPath();x.arc(px*W,py*H,8,0,7);x.fill();x.lineWidth=2;x.strokeStyle="#fff";x.stroke()}
  }
  if(opts.picked){x.fillStyle=C.coral;x.beginPath();x.arc(opts.picked.x*W,opts.picked.y*H,10,0,7);x.fill();x.lineWidth=3;x.strokeStyle="#fff";x.stroke()}
}

    <div class="between"><b style="font-size:14px">${esc(s.name)}</b><span style="font-size:12px;color:${C.turquoiseInk}">${KIND[s.kind]}</span></div>
    <span class="small">${esc(s.desc)}</span>
    <div class="row" style="gap:14px">${s.phone?`<button class="link" style="color:${C.coralInk};font-weight:700" data-act="tel:${s.phone}">${svg("phone",C.coralInk,14)} ${s.phone}</button>`:""}${s.url?`<button class="link" data-act="site">${svg("ext",C.turquoiseInk,14)} Site</button>`:""}</div>
  </div>`).join("")}</div>`;
}

function screenPerfil(){
  return `
  <div><span class="display d30" style="display:block">Perfil</span><span class="small">${esc(DB.profile.email)}</span></div>
  <div class="card">
    <span class="h-sm">Apelido no mural e nas avaliações</span>
    <input data-bind="nickname" maxlength="40" placeholder="Vazio = Anônimo" value="${esc(S.nickname)}">
    <span class="h-sm">Cidade padrão</span>
    <button class="link" data-overlay="cidade">${esc(S.city.name)} · ${S.city.state} ${svg("chev",C.turquoiseInk,16)}</button>
    <button class="btn turq" data-act="salvarPerfil">Salvar</button>
  </div>
  <div class="card"><span class="h-sm">Privacidade</span>
    <p class="p">Relatos e mensagens nunca mostram seu nome ou e-mail. Só o apelido que você escolher aparece no mural e nas avaliações de lugares.</p></div>
  <button class="btn ghost" data-act="sair">Sair</button>
  <button class="link" style="color:${C.coralInk};align-self:center;font-size:14px" data-act="excluir">Excluir minha conta</button>`;
}

function screenLugar(){
  const p=DB.places.find(x=>x.id===S.placeId);
  const axes={welcome:p.welcome,affection:p.affection,restroom:p.restroom,crowd:p.crowd};
  const d=S.draft;
  return `
  <div class="card hero">
    <div style="display:flex;align-items:center;gap:8px"><span class="display d30">${esc(p.name)}</span>${p.verified?svg("check",C.turquoiseInk,20):""}</div>
    <span class="small">${PLACECAT[p.category]} · ${esc(p.neighborhood)} · ${esc(S.city.name)}</span>
    ${p.address?`<span class="p">${esc(p.address)}</span>`:""}
    <button class="link" style="color:${C.dim};font-size:12px;align-self:flex-start" data-denuncia="1">${svg("flag",C.dim,13)} Denunciar lugar</button>
    ${p.score==null?`<span class="p" style="color:${C.dim};font-size:15px">Sem avaliações ainda. Seja a primeira pessoa.</span>`:`
    <div style="display:flex;align-items:center;gap:12px">${irisScore(p.score,54)}
      <div style="flex:1;display:flex;flex-direction:column;gap:3px">
        <span class="display" style="font-size:34px;letter-spacing:0;color:${scoreColor(p.score)}">${p.score.toFixed(1)}</span>
        ${badgeHtml(p.badge,true)}
        <span class="small">${p.count} avaliações de quem frequenta</span>
      </div></div>
    <span class="small">${BADGES[p.badge].note}</span>
    ${axisBars(axes)}`}
    ${p.flagged?`<div class="warn">${svg("warn",C.coralInk,18)}<span class="p" style="flex:1">${p.onSite>0?`${p.onSite} relato apontando este lugar`:`${p.recent} relato${p.recent===1?"":"s"} num raio de 100 m`} nos últimos 6 meses${p.high>0?`, ${p.high} grave`:""}.${p.high>0?" A nota já desconta isso.":""}</span></div>`:""}
  </div>
  ${mapHtml("map-place",170,"")}
  <div class="card" style="gap:16px">
    <span class="h">Como foi lá?</span>
    ${AXIS_KEYS.map(k=>`<div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-weight:500;font-size:14px">${AXES[k].question}</span>
      <span class="hint">${AXES[k].hint}</span>
      ${rainbow(d[k],16,k)}</div>`).join("")}
    <textarea data-bind="draftComment" maxlength="500" placeholder="Quer contar como foi? (opcional, até 500 caracteres)">${esc(d.comment)}</textarea>
    <button class="btn yellow" data-act="avaliar">Enviar avaliação</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <span class="h">Avaliações</span>
    ${DB.ratings.map(r=>`<div class="card">
      <div class="between">${rainbow(r.overall,7)}<span class="small">${esc(r.nick)} · ${r.when}</span></div>
      ${axisBars({welcome:r.welcome,affection:r.affection,restroom:r.restroom,crowd:r.crowd},5)}
      ${r.comment?`<p class="p">${esc(r.comment)}</p>`:""}
    </div>`).join("")}
  </div>`;
}

/* ---------- overlays ---------- */
function overlayEmergencia(){
  return `<div class="sheet-bg" data-close="1"><div class="sheet" data-stop="1">
    <div class="between"><span class="display d24">Emergência</span><button class="x" data-close="1">×</button></div>
    ${EMERGENCY.map(c=>`<div class="emg" data-act="tel:${c.number}"><span class="num">${c.number}</span><span style="flex:1"><b style="display:block;font-size:15px">${c.name}</b><span class="small">${c.note}</span></span></div>`).join("")}
    <span class="h-sm" style="color:${C.turquoiseInk}">Apoio em ${esc(S.city.name)}</span>
    ${DB.services.slice(0,2).map(s=>`<div class="emg" style="display:block" data-act="tel:${s.phone}"><b style="font-size:14px">${esc(s.name)}</b><span class="small" style="display:block">${esc(s.desc)}</span><b style="font-size:14px;color:${C.coralInk}">${s.phone}</b></div>`).join("")}
  </div></div>`;
}
function overlayCidade(){
  const q=S.citySearch.trim().toLowerCase();
  const res=q.length>=2?DB.cities.filter(([n])=>n.toLowerCase().includes(q)):[];
  return `<div class="full-modal">
    <div class="between"><span class="display d24">Cidade</span><button class="x" data-close="1">×</button></div>
    <input data-bind="citySearch" placeholder="Digite o nome da cidade" value="${esc(S.citySearch)}" autofocus>
    <div style="flex:1;overflow-y:auto">${res.map(([n,s])=>`<div class="list-item" data-act="setcity:${n}|${s}">${n} <span style="color:${C.dim}">· ${s}</span></div>`).join("")||(q.length>=2?`<span class="small">Nenhuma cidade encontrada.</span>`:"")}</div>
  </div>`;
}

/* ---------- render ---------- */
function render(keepScroll){
  const main=document.getElementById("main");
  const y=keepScroll?main.scrollTop:0;
  renderBar();renderTabs();
  main.innerHTML=S.screen==="lugar"?screenLugar():
    S.tab==="inicio"?screenInicio():S.tab==="mapa"?screenMapa():S.tab==="registrar"?screenRegistrar():S.tab==="apoio"?screenApoio():screenPerfil();
  document.getElementById("overlay").innerHTML=S.overlay==="emergencia"?overlayEmergencia():S.overlay==="cidade"?overlayCidade():"";
  main.scrollTop=y;
  const m=document.getElementById("map-main");if(m)drawMap(m,{places:S.layers.lugares,occurrences:S.layers.relatos,heat:S.layers.relatos});
  const p1=document.getElementById("map-pick");if(p1)drawMap(p1,{heat:false,occurrences:false,picked:S.regPoint&&S.regPoint.rel});
  const p2=document.getElementById("map-pick2");if(p2)drawMap(p2,{heat:false,occurrences:false,picked:S.placePoint&&S.placePoint.rel});
  const p3=document.getElementById("map-place");if(p3)drawMap(p3,{heat:false,occurrences:false,places:true,picked:{x:.5,y:.5}});
  const auto=document.querySelector("[autofocus]");if(auto)auto.focus();
}

/* ---------- eventos ---------- */
document.getElementById("phone").addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-place],[data-back],[data-overlay],[data-close],[data-act],[data-rate],[data-denuncia],[data-pick],[data-stop]");
  if(!t)return;
  if(t.dataset.stop!==undefined&&!t.closest("[data-act]"))e.stopPropagation();
  if(t.dataset.close!==undefined&&t.dataset.stop===undefined){S.overlay=null;return render()}
  if(t.dataset.overlay){S.overlay=t.dataset.overlay;S.citySearch="";return render(true)}
  if(t.dataset.denuncia!==undefined){return toast("Denúncia enviada para a moderação.")}
  if(t.dataset.tab){S.tab=t.dataset.tab;S.screen=null;S.selected=null;return render()}
  if(t.dataset.place){S.placeId=t.dataset.place;S.screen="lugar";S.draft={welcome:0,affection:0,restroom:0,crowd:0,comment:""};return render()}
  if(t.dataset.back!==undefined){S.screen=null;return render()}
  if(t.dataset.rate){S.draft[t.dataset.rate]=Number(t.dataset.v);return render(true)}
  if(t.dataset.pick){
    const cv=t,r=cv.getBoundingClientRect(),rel={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};
    const pos={lat:S.city.lat+(0.5-rel.y)*0.08,lng:S.city.lng+(rel.x-0.5)*0.08,rel};
    if(cv.dataset.pick==="pick")S.regPoint=pos;
    else if(cv.dataset.pick==="pick2")S.placePoint=pos;
    else if(cv.dataset.pick==="select"){const i=Math.floor(rel.x*DB.occurrences.length);S.selected=DB.occurrences[Math.max(0,Math.min(DB.occurrences.length-1,i))].id}
    return render(true);
  }
  const a=t.dataset.act;if(!a)return;
  const [k,v]=a.split(":");
  if(k==="filter")S.mapFilter=v;
  else if(k==="layer")S.layers[v]=!S.layers[v];
  else if(k==="mode")S.regMode=v;
  else if(k==="type")S.regType=v;
  else if(k==="sev")S.regSev=v;
  else if(k==="pcat")S.placeCat=v;
  else if(k==="supcat")S.supCat=v;
  else if(k==="geo"){S.regPoint={lat:S.city.lat,lng:S.city.lng,rel:{x:.5,y:.5}};toast("Localização usada (exemplo).")}
  else if(k==="geo2"){S.placePoint={lat:S.city.lat,lng:S.city.lng,rel:{x:.5,y:.5}};toast("Localização usada (exemplo).")}
  else if(k==="tel")toast(`No app, abre o discador em ${v}.`);
  else if(k==="site")toast("No app, abre o site do serviço.");
  else if(k==="like"){const m=DB.messages.find(x=>x.id===v);m.liked=!m.liked;m.likes+=m.liked?1:-1}
  else if(k==="publicar"){
    if(!S.supText.trim())return toast("Escreva a mensagem.");
    DB.messages.unshift({id:"m"+Date.now(),category:S.supCat,nick:S.supNick.trim()||"Anônimo",when:"agora",likes:0,liked:false,content:S.supText.trim()});
    S.supText="";toast("Mensagem publicada no mural.");
  }
  else if(k==="enviarRelato"){
    if(!S.regPoint)return toast("Falta o local: toque no mapa.");
    DB.occurrences.unshift({id:"o"+Date.now(),type:S.regType,severity:S.regSev,neighborhood:"Centro",date:"23 de set. de 2026",obf:true,description:S.regDesc.trim()});
    DB.stats.total++;DB.stats.last30++;DB.typeCounts[S.regType]++;S.regDesc="";S.regPoint=null;S.tab="mapa";
    toast("Relato registrado. Já aparece no mapa, sem identificação sua.");
  }
  else if(k==="enviarLugar"){
    if(S.placeName.trim().length<2)return toast("Dê um nome ao lugar.");
    if(!S.placePoint)return toast("Falta o local: toque no mapa.");
    const id="p"+Date.now();
    DB.places.push({id,name:S.placeName.trim(),category:S.placeCat,neighborhood:"Centro",address:S.placeAddr,verified:false,score:null,count:0,badge:"poucas"});
    S.placeName="";S.placeAddr="";S.placePoint=null;S.placeId=id;S.screen="lugar";
    S.draft={welcome:0,affection:0,restroom:0,crowd:0,comment:""};toast("Lugar cadastrado. Avalie para começar.");
  }
  else if(k==="avaliar"){
    const miss=AXIS_KEYS.filter(x=>!S.draft[x]);
    if(miss.length)return toast(`Falta responder: ${AXES[miss[0]].label}.`);
    const p=DB.places.find(x=>x.id===S.placeId);
    DB.ratings.unshift({id:"r"+Date.now(),nick:S.nickname.trim()||"Anônimo",when:"agora",mine:true,
      overall:(S.draft.welcome*.3+S.draft.affection*.3+S.draft.restroom*.25+S.draft.crowd*.15),
      welcome:S.draft.welcome,affection:S.draft.affection,restroom:S.draft.restroom,crowd:S.draft.crowd,comment:S.draft.comment});
    p.count++;toast("Avaliação registrada. Obrigado por ajudar a comunidade.");
  }
  else if(k==="salvarPerfil")toast("Salvo.");
  else if(k==="sair")toast("No app, encerra a sessão.");
  else if(k==="excluir")toast("No app, pede confirmação antes de excluir a conta.");
  else if(k==="setcity"){const [n,st]=v.split("|");S.city={name:n,state:st,lat:S.city.lat,lng:S.city.lng};S.overlay=null;toast(`Cidade: ${n} · ${st}`)}
  render(true);
});
document.getElementById("phone").addEventListener("input",e=>{
  const b=e.target.dataset.bind;if(!b)return;
  if(b==="draftComment")S.draft.comment=e.target.value;else S[b]=e.target.value;
  if(b==="citySearch"||b==="regDesc"){const pos=e.target.selectionStart;render(true);const n=document.querySelector(`[data-bind="${b}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
});
/* abertura direta por hash: #mapa, #registrar, #apoio, #perfil, #lugar */
(function(){const h=decodeURIComponent(location.hash.replace("#",""));
 if(["inicio","mapa","registrar","apoio","perfil"].includes(h))S.tab=h;
 else if(h==="lugar"){S.screen="lugar";S.placeId="p1"}})();
render();
</script>
</body>
