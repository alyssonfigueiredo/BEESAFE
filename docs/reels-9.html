<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Irisa · Reels 9 · sua cidade</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600&family=Oswald:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root{--paper:#F5F4F1;--surface:#FFFFFF;--subtle:#ECEAE5;--border:#E6E3DD;--night:#141829;--night2:#0F1220;--ink:#141829;--muted:#3D4560;--dim:#7C8296;
  --coral:#FF6964;--orange:#FFA353;--yellow:#FFD066;--turq:#49DCC0;--lilac:#A889FF;--blue:#59A7FF;--amber:#FFAD0F;
  --coralInk:#C72825;--orangeInk:#AB6207;--yellowInk:#9C6C00;--turqInk:#0A8B7A;--lilacInk:#6037F0;
  --wordmark:"Urbanist","Helvetica Neue",Arial,sans-serif;--display:"Oswald","Arial Narrow",Impact,sans-serif;--body:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --rb:linear-gradient(90deg,var(--coral),var(--orange),var(--yellow),var(--turq),var(--blue),var(--lilac));
  --pane:rgba(255,255,255,.62);--pane-edge:rgba(255,255,255,.8);
  --shadow-card:0 2px 4px rgba(20,24,41,.03),0 16px 40px rgba(20,24,41,.07);
  --glass-inset:inset 0 1px 0 #fff,inset 0 0 0 1px var(--pane-edge);
  --r-xl:28px;--r-lg:24px;--r-md:18px}
*{box-sizing:border-box}p{margin:0}
html,body{margin:0;background:#e9e9ec;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;height:100vh;font-family:var(--body)}
#stage{position:relative;width:1080px;height:1920px;flex:none;overflow:hidden;color:var(--ink);transform-origin:center;background:var(--paper)}
.capture body,.capture{background:var(--paper)}
.bg{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(60% 34% at -6% 0%,color-mix(in srgb,var(--turq) 42%,transparent),transparent 62%),
  radial-gradient(50% 30% at 106% 8%,color-mix(in srgb,var(--coral) 34%,transparent),transparent 62%),
  radial-gradient(55% 32% at 104% 100%,color-mix(in srgb,var(--lilac) 40%,transparent),transparent 62%),
  radial-gradient(45% 28% at -4% 100%,color-mix(in srgb,var(--yellow) 38%,transparent),transparent 62%)}
.halo{position:absolute;inset:-30%;pointer-events:none;filter:blur(70px)}
.h1{background:radial-gradient(28% 20% at 22% 30%,color-mix(in srgb,var(--turq) 30%,transparent),transparent 70%),radial-gradient(26% 18% at 80% 70%,color-mix(in srgb,var(--lilac) 28%,transparent),transparent 70%)}
.h2{background:radial-gradient(22% 16% at 76% 20%,color-mix(in srgb,var(--coral) 24%,transparent),transparent 70%),radial-gradient(22% 16% at 24% 84%,color-mix(in srgb,var(--yellow) 26%,transparent),transparent 70%)}
.grain{display:none}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;padding:220px 80px 540px}
.c{text-align:center}
.disp{font-family:var(--display);text-transform:uppercase;font-weight:700;letter-spacing:.01em;line-height:.98;margin:0;color:var(--ink)}
.w{display:inline-block;will-change:transform,opacity,filter}
.rainbow{background:var(--rb);-webkit-background-clip:text;background-clip:text;color:transparent;padding-top:.2em;margin-top:-.2em}
.rule{height:12px;border-radius:6px;background:var(--rb);transform-origin:left}
.small{font-family:var(--body);font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:28px;color:var(--dim)}
.body{font-size:40px;line-height:1.35;color:var(--muted);max-width:860px}
.slam{font-family:var(--display);text-transform:uppercase;font-weight:700;font-size:150px;line-height:1;letter-spacing:.01em;color:var(--ink)}
.pct{font-family:var(--display);font-weight:700;font-size:300px;line-height:1;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:14px;padding:26px 52px;border-radius:999px;font-family:var(--body);font-weight:600;font-size:38px;color:var(--night);box-shadow:0 6px 18px rgba(255,105,100,.28)}
.qcard{width:900px;padding:52px 60px;border-radius:var(--r-xl);background:var(--pane);box-shadow:var(--shadow-card),var(--glass-inset);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.qcard p{font-size:46px;line-height:1.3;color:var(--ink)}
.dark{background:rgba(20,24,41,.92);color:var(--ink);box-shadow:0 22px 50px rgba(20,24,41,.25),inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.08)}
.dark p,.dark .body{color:var(--muted)}.dark .disp{color:var(--ink)}
.stars{font-size:190px;letter-spacing:.06em;color:#C9C6BE;position:relative;display:inline-block;line-height:1}
.stars i{position:absolute;left:-4%;right:-4%;top:50%;height:16px;border-radius:8px;background:var(--coral);transform:rotate(-6deg);transform-origin:left}
.strike{position:relative;display:inline-block}
.strike i{position:absolute;left:-3%;right:-3%;top:52%;height:14px;border-radius:7px;background:var(--coral);transform:rotate(-4deg);transform-origin:left}
.nring{position:relative;width:560px;height:560px;border-radius:50%}
.nring .fill{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--coral),var(--orange),var(--yellow),var(--turq),var(--blue),var(--lilac),var(--coral));-webkit-mask:conic-gradient(#000 var(--p,0%),transparent 0);mask:conic-gradient(#000 var(--p,0%),transparent 0)}
.nring .track{position:absolute;inset:0;border-radius:50%;background:rgba(20,24,41,.07)}
.nring .hole{position:absolute;inset:70px;border-radius:50%;background:var(--surface);box-shadow:var(--glass-inset);display:flex;align-items:center;justify-content:center}
.nring b{font-family:var(--display);font-weight:700;font-size:200px;line-height:1;color:var(--ink)}
.badge-big{padding:16px 34px;border-radius:999px;background:color-mix(in srgb,var(--turq) 22%,#fff);color:var(--turqInk);font-family:var(--body);font-weight:600;font-size:36px}
.bar{height:22px;border-radius:11px;background:rgba(20,24,41,.08);width:900px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:11px;transform-origin:left;transform:scaleX(0)}
.brand{position:absolute;bottom:440px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;font-family:var(--wordmark);font-weight:500;text-transform:uppercase;letter-spacing:.2em;font-size:30px;color:var(--ink)}
.brand b{font-weight:500;color:var(--amber)}
.mark{width:36px;height:36px;flex:none;display:block}
.map{position:relative;width:900px;height:620px;border-radius:var(--r-xl);background:#ECEAE5;overflow:hidden;box-shadow:var(--shadow-card),var(--glass-inset)}
.map .st{position:absolute;background:#fff}
.map .pin{position:absolute;width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--body);font-weight:700;font-size:28px;color:var(--night);box-shadow:0 6px 16px rgba(20,24,41,.18)}
.map .ring{position:absolute;border-radius:50%;border:5px dashed color-mix(in srgb,var(--coral) 85%,transparent);background:color-mix(in srgb,var(--coral) 16%,transparent)}
.map .dot{position:absolute;width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 6px rgba(20,24,41,.2)}
.lvl{display:flex;gap:26px}
.lvl div{padding:30px 40px;border-radius:var(--r-lg);text-align:center;width:420px;box-shadow:0 6px 18px rgba(20,24,41,.10)}
.lvl b{display:block;font-family:var(--body);text-transform:uppercase;letter-spacing:.08em;font-size:40px;font-weight:700;color:var(--night)}
.lvl span{font-size:28px;color:var(--night)}
.conf{position:absolute;width:18px;height:18px;border-radius:4px}
.handle{display:flex;align-items:center;gap:26px;font-family:var(--wordmark);font-weight:500;letter-spacing:.12em;font-size:84px;line-height:1;color:var(--ink)}
</style>
</head>
